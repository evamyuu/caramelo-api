[project]
name = "caramelo-api"
version = "0.1.0"
description = "Backend for Caramelo, a guard-dog assistant that protects older adults on their phones."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "playwright>=1.48", "pymongo>=4.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "websockets>=13", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["e2e: end-to-end tests that launch a real browser"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
